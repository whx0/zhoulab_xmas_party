<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a39">
<title>Timer | Zhou Lab Xmas Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body.timerpage { margin: 0; min-height: 100dvh; overflow: hidden; color: #fff;
    background: radial-gradient(ellipse at 50% 0%, #2a5465 0%, #143546 45%, #0f2a39 100%); }
  .tp { position: relative; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vh 4vw; isolation: isolate; }
  .tp .frame { position: fixed; inset: 16px; }
  .tp .eyebrow { font-size: clamp(11px, 1.4vw, 18px); letter-spacing: .5em; color: var(--gold2); }
  .tp .label { font-family: var(--serif); font-size: clamp(28px, 5vw, 72px); font-style: italic; margin: 1vh 0 3vh; }
  .tring { position: relative; width: min(70vw, 62vh); aspect-ratio: 1; }
  .tring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .tring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tring .num { font-family: var(--serif); font-weight: 500; font-size: min(17vw, 15vh); line-height: 1; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; }
  .tring .st { font-family: var(--sans); letter-spacing: .5em; font-size: clamp(10px, 1.3vw, 16px); color: var(--gold2); margin-top: 1.5vh; }
  .tp.end .num { color: var(--gold2); animation: blink2 1s steps(2) infinite; }
  .tp.idle .num { font-size: min(9vw, 9vh); font-style: italic; }
  @keyframes blink2 { 50% { opacity: .35; } }
  .tp .foot { margin-top: 3vh; font-size: clamp(10px, 1.2vw, 14px); letter-spacing: .3em; color: #b9cad2; }
</style>
</head>
<body class="timerpage">
<div class="tp" id="tp"></div>
<script type="module" src="js/timer.js"></script>
</body>
</html>
